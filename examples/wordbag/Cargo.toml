[package]
name = "wordbag"
version = "0.1.0"
edition = "2021"
description = "rulisp example glue crate — the macro-based twin of the hand-written M1 oracle"
publish = false

[lib]
# rlib in addition to cdylib so `cargo test -p wordbag` can link the
# manifest golden-snapshot test; the cdylib artifact is unchanged.
crate-type = ["cdylib", "rlib"]

[features]
# Flipped by the live-reload test: rebuild with --features alt-greeting,
# reload-crate, observe new behavior without restarting the Lisp image.
alt-greeting = []

[dependencies]
rulisp = { path = "../../crates/rulisp" }
