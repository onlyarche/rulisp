[package]
name = "wasm"
version = "0.1.0"
edition = "2021"
description = "rulisp example: a WebAssembly runtime for Common Lisp (wasmi-based)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rulisp = { path = "../../crates/rulisp" }
# wasmi, not wasmtime, on purpose: wasmi is a pure interpreter that installs
# NO signal handlers — wasmtime's signal-based trap handling conflicts with
# SBCL's signal-driven GC (see BOUNDARY.md §7, "audit dependencies for
# sigaction").
wasmi = "0.50"
wat = "1"
# the WASI preview1 sandbox (v0.7): wasi-common's sync implementation and
# cap-std's capability-based directories — no tokio, no signal handlers;
# the audit (make audit) checks the artifact on every push
wasmi_wasi = "0.50"
cap-std = "3"
# the sandbox's entropy: the OS, not a thread-local RNG with a fork handler
cap-rand = "3"
