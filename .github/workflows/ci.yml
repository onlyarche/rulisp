name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_seed:
        description: 'RULISP_FUZZ_SEED for the m4 fuzzers (empty = default 42)'
        required: false
        default: ''

env:
  RULISP_FUZZ_SEED: ${{ github.event.inputs.fuzz_seed || '' }}

jobs:
  rust:
    name: cargo tests (golden manifest + trybuild)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - name: build the ABI oracle (standalone crate)
        run: cargo build --manifest-path tests/m1-handwritten/Cargo.toml
      - name: docs.rs front door (missing_docs, broken links)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p rulisp -p rulisp-macros -p rulisp-runtime
      - name: crate-level doctest
        run: cargo test --doc -p rulisp
      - name: BOUNDARY §7 signal audit over every example (with self-test)
        run: make audit
      # docs/stability.md §1, the Rust surface: this tree against the
      # latest crates.io release, asked the criterion-3 question — does it
      # break a consumer of that release? `--release-type minor` is
      # load-bearing: under Cargo's 0.x rule a 0.5→0.6 bump would license
      # breaking changes. rulisp::runtime is public and checked too; hiding
      # it is the 1.0 major's first commit.
      - name: Rust API gate (cargo-semver-checks vs the crates.io release, as a minor)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: rulisp-runtime,rulisp-macros,rulisp
          release-type: minor

  msrv:
    # docs/stability.md §6: the declared rust-version is checked on exactly
    # that toolchain, read from Cargo.toml so the number has one site. The
    # three published crates plus wordbag: the code the macros GENERATE is
    # held to the MSRV too, not only the macros themselves.
    name: MSRV (cargo check on the declared rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          RV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' crates/rulisp/Cargo.toml)
          echo "rust-version = $RV"
          rustup toolchain install "$RV" --profile minimal
          cargo "+$RV" check -p rulisp -p rulisp-macros -p rulisp-runtime -p wordbag --locked
      - run: make check-versions
      - name: 1.0 exit criteria, the mechanical part (docs/stability.md §8)
        run: make check-1.0

  sbcl-linux:
    name: SBCL / Linux x86-64 (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the previous release's tag, for make compat
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y sbcl
      # beta.quicklisp.org hiccups mid-install now and then (run 36388353221
      # lost a required job to it); a required job must not flake on the
      # installer's network — retry from a clean slate, since the installer
      # refuses a half-written ~/quicklisp
      - name: install quicklisp (with retry)
        run: |
          for i in 1 2 3 4 5; do
            rm -rf "$HOME/quicklisp" quicklisp.lisp
            curl -fsSLO https://beta.quicklisp.org/quicklisp.lisp \
              && sbcl --non-interactive --load quicklisp.lisp \
                      --eval '(quicklisp-quickstart:install)' \
              && exit 0
            echo "quicklisp install attempt $i failed; retrying in 15 s" >&2
            sleep 15
          done
          exit 1
      - name: oracle gate (hand-written shims)
        run: make test-m2
      - name: full gate (macro pipeline + hardening)
        run: make test-m4
      # docs/stability.md §8 criterion 3, mechanically: the previous
      # release's loader loads this tree's wordbag, and the previous
      # release's suite runs against this tree's loader. The pin moves at
      # release (docs/releasing.md step 9).
      - name: cross-version gates against v0.7.0 (old loader / new crate, old suite / new loader)
        run: make compat PREV=v0.7.0
      - name: fetch suite (async HTTPS example; the §7/§10 enforcement §12 cites)
        run: make test-fetch
      - name: httpd suite (the HTTP server example, v0.8's flagship)
        run: make test-httpd
      # docs/stability.md §9: loading the system must need no toolchain.
      # Separate --evals: a form is READ before the previous one runs, so
      # asdf:/uiop: symbols can only appear after (require :asdf).
      - name: load :rulisp with cargo stripped from PATH
        run: |
          env -i HOME="$HOME" PATH=/bin /usr/bin/sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval '(load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))' \
            --eval '(push (merge-pathnames "lisp/" (uiop:getcwd)) asdf:*central-registry*)' \
            --eval '(assert (zerop (length (string-trim (list #\Newline) (uiop:run-program "command -v cargo || true" :output :string)))) () "cargo is still reachable on PATH")' \
            --eval '(ql:quickload :rulisp :silent t)' \
            --eval '(format t "LOADED-WITHOUT-CARGO~%")' \
            | tee no-cargo.log
          grep -q LOADED-WITHOUT-CARGO no-cargo.log
      # docs/installation.md "Getting rulisp": the local-projects route,
      # verified as written — nothing pushed onto asdf:*central-registry*
      - name: load :rulisp from quicklisp local-projects
        run: |
          ln -s "$PWD" "$HOME/quicklisp/local-projects/rulisp"
          sbcl --non-interactive \
            --eval '(load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))' \
            --eval '(ql:quickload :rulisp :silent t)' \
            --eval '(format t "LOCAL-PROJECTS-OK~%")' | tee lp.log
          grep -q LOCAL-PROJECTS-OK lp.log
      # docs/stability.md §9: the Quicklisp dist builder loads every system
      # of every .asd in the tarball — one file, lisp/rulisp.asd, defining
      # rulisp and rulisp/test — and neither may need cargo
      - name: Quicklisp dist dry run (every system in every .asd, no cargo)
        run: make dist-dryrun
      # docs/usage.md Case A, as written: the previous release's asset —
      # pinned, so this is old crate / new loader every day and not a
      # same-version test the day after a release — downloaded and loaded
      # with load-blob-crate, cargo out of reach
      - name: load a downloaded release asset with load-blob-crate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/blobs
          gh release download v0.7.0 --pattern 'libwordbag-linux-x86_64.so' --dir /tmp/blobs
          env -i HOME="$HOME" PATH=/bin /usr/bin/sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval '(load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))' \
            --eval '(push (merge-pathnames "lisp/" (uiop:getcwd)) asdf:*central-registry*)' \
            --eval '(ql:quickload :rulisp :silent t)' \
            --eval '(rulisp:load-blob-crate #p"/tmp/blobs/" "wordbag")' \
            --eval '(format t "BLOB-ASSET-OK ~A~%" (uiop:symbol-call :wordbag :greet "release"))' | tee blob.log
          grep -q "BLOB-ASSET-OK Hello, release!" blob.log

  ccl-linux:
    name: CCL / Linux x86-64 (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install ccl
        run: |
          curl -sL -o ccl.tar.gz https://github.com/Clozure/ccl/releases/download/v1.13/ccl-1.13-linuxx86.tar.gz
          tar xzf ccl.tar.gz -C "$HOME"
      - run: sudo apt-get update && sudo apt-get install -y sbcl # quicklisp installer convenience
      # beta.quicklisp.org hiccups mid-install now and then (run 36388353221
      # lost a required job to it); a required job must not flake on the
      # installer's network — retry from a clean slate, since the installer
      # refuses a half-written ~/quicklisp
      - name: install quicklisp (with retry)
        run: |
          for i in 1 2 3 4 5; do
            rm -rf "$HOME/quicklisp" quicklisp.lisp
            curl -fsSLO https://beta.quicklisp.org/quicklisp.lisp \
              && sbcl --non-interactive --load quicklisp.lisp \
                      --eval '(quicklisp-quickstart:install)' \
              && exit 0
            echo "quicklisp install attempt $i failed; retrying in 15 s" >&2
            sleep 15
          done
          exit 1
      - run: make test-ccl CCL="$HOME/ccl/lx86cl64"
      - name: fetch suite on CCL
        run: make test-fetch-ccl CCL="$HOME/ccl/lx86cl64"
      - name: httpd suite on CCL
        run: make test-httpd-ccl CCL="$HOME/ccl/lx86cl64"

  sbcl-macos:
    name: SBCL / macOS arm64 (required)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install sbcl
      # beta.quicklisp.org hiccups mid-install now and then (run 36388353221
      # lost a required job to it); a required job must not flake on the
      # installer's network — retry from a clean slate, since the installer
      # refuses a half-written ~/quicklisp
      - name: install quicklisp (with retry)
        run: |
          for i in 1 2 3 4 5; do
            rm -rf "$HOME/quicklisp" quicklisp.lisp
            curl -fsSLO https://beta.quicklisp.org/quicklisp.lisp \
              && sbcl --non-interactive --load quicklisp.lisp \
                      --eval '(quicklisp-quickstart:install)' \
              && exit 0
            echo "quicklisp install attempt $i failed; retrying in 15 s" >&2
            sleep 15
          done
          exit 1
      - run: make test-m4
      # Promoted 2026-09-28 after 37 consecutive green runs since 2026-09-03
      # (the step never failed itself). DEMOTION, should it flake: restore
      # `continue-on-error: true` and the "(best-effort …)" name in ONE
      # commit that links the failing run, records the cause in ROADMAP,
      # and downgrades README/CHANGELOG wording — never silently.
      - name: fetch suite (async HTTPS example)
        run: make test-fetch
      - name: httpd suite (the HTTP server example)
        run: make test-httpd

  sbcl-windows:
    name: SBCL / Windows x86-64 (required)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo tests (platform-independent)
        run: cargo test --workspace
      # BOUNDARY §7 on the host whose artifacts a release attaches: the
      # audit reads PE imports through rustup's llvm-readobj
      - name: signal audit over every example (PE imports) with self-test
        run: |
          rustup component add llvm-tools
          make audit
      # the community feed 503s occasionally; a required job must not
      # flake on a package-feed hiccup
      - name: install sbcl (with retry)
        run: |
          for i in 1 2 3 4 5; do
            choco install sbcl --no-progress -y && exit 0
            echo "choco attempt $i failed; retrying in $((i*30))s"
            sleep $((i*30))
          done
          exit 1
      # beta.quicklisp.org hiccups mid-install now and then (run 36388353221
      # lost a required job to it); a required job must not flake on the
      # installer's network — retry from a clean slate, since the installer
      # refuses a half-written ~/quicklisp
      - name: install quicklisp (with retry)
        run: |
          for i in 1 2 3 4 5; do
            rm -rf "$HOME/quicklisp" quicklisp.lisp
            curl -fsSLO https://beta.quicklisp.org/quicklisp.lisp \
              && sbcl --non-interactive --load quicklisp.lisp \
                      --eval '(quicklisp-quickstart:install)' \
              && exit 0
            echo "quicklisp install attempt $i failed; retrying in 15 s" >&2
            sleep 15
          done
          exit 1
      - name: full gate
        run: make test-m4
      # first time the fetch suite runs on Windows (fetch.dll ships in every
      # release); promoted by the written procedure once it has a streak
      - name: fetch suite (best-effort on Windows)
        continue-on-error: true
        run: make test-fetch
      # the httpd suite's first runs on Windows (httpd.dll will ship in every
      # release): best-effort, promoted by the written procedure once it has
      # a streak — counted from its first green run on main
      - name: httpd suite (best-effort on Windows)
        continue-on-error: true
        run: make test-httpd

  ecl-linux:
    # Promoted to required 2026-09-02 after 24 consecutive green runs since
    # 2026-07-29 (the ECL trampoline fix), with the program-op deployment
    # smoke added in v0.4. "Fully supported" and "may fail" cannot both be
    # true. DEMOTION PROCEDURE, should ECL flake: restore
    # `continue-on-error: true` and the "(best-effort, may fail)" name in
    # ONE commit that also (a) links the failing run, (b) notes the cause
    # in ROADMAP.md item 8, and (c) downgrades CHANGELOG/README wording
    # from "supported" to "best-effort" — never silently.
    name: ECL / Linux (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ecl sbcl
      # beta.quicklisp.org hiccups mid-install now and then (run 36388353221
      # lost a required job to it); a required job must not flake on the
      # installer's network — retry from a clean slate, since the installer
      # refuses a half-written ~/quicklisp
      - name: install quicklisp (with retry)
        run: |
          for i in 1 2 3 4 5; do
            rm -rf "$HOME/quicklisp" quicklisp.lisp
            curl -fsSLO https://beta.quicklisp.org/quicklisp.lisp \
              && sbcl --non-interactive --load quicklisp.lisp \
                      --eval '(quicklisp-quickstart:install)' \
              && exit 0
            echo "quicklisp install attempt $i failed; retrying in 15 s" >&2
            sleep 15
          done
          exit 1
      # ecl exits 0 even after landing in the debugger on EOF — require the
      # suite's own summary line so a crashed run cannot show green
      - run: |
          ecl --norc --load tests/run-m4.lisp 2>&1 | tee ecl.log
          grep -q "Pass: " ecl.log && ! grep -qE "Fail: *[1-9]" ecl.log
      - name: program-op executable (the ECL deployment story)
        run: make test-ecl-program

  sbcl-linux-arm64:
    # First arm host. meta.rs's aarch64-unknown-linux-gnu target and the
    # loader's arm64 paths (target-compatible-p in manifest.lisp,
    # host-blob-suffix in build.lisp) had never executed before this job.
    # Promoted to required 2026-09-30 after 26 consecutive green runs on
    # main since the clock restarted on 2026-09-08 (runs 34173012968 …
    # 36669486379; the restart followed the one real finding this host
    # produced, a GC-timing assumption in m4.gc-finalization), with the
    # deployment path exercised first: blobs run 36388354650 built and
    # audited the four examples on this host and the release job
    # re-audited sixteen assets. DEMOTION, should it turn unreliable:
    # restore `continue-on-error: true` and the "(best-effort)" name in ONE
    # commit that links the failing run, records the cause in ROADMAP,
    # takes the linux-arm64 leg out of blobs.yml and downgrades
    # README/CHANGELOG wording — never silently (docs/stability.md §5).
    name: SBCL / Linux aarch64 (required)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y sbcl
      # beta.quicklisp.org hiccups mid-install now and then (run 36388353221
      # lost a required job to it); a required job must not flake on the
      # installer's network — retry from a clean slate, since the installer
      # refuses a half-written ~/quicklisp
      - name: install quicklisp (with retry)
        run: |
          for i in 1 2 3 4 5; do
            rm -rf "$HOME/quicklisp" quicklisp.lisp
            curl -fsSLO https://beta.quicklisp.org/quicklisp.lisp \
              && sbcl --non-interactive --load quicklisp.lisp \
                      --eval '(quicklisp-quickstart:install)' \
              && exit 0
            echo "quicklisp install attempt $i failed; retrying in 15 s" >&2
            sleep 15
          done
          exit 1
      - run: make test-m4
      - name: fetch suite on aarch64
        run: make test-fetch
      - name: httpd suite on aarch64
        run: make test-httpd
      # docs/usage.md Case A on this host, as on x86-64: the previous
      # release's arm asset (0.7.0 is the first release that has one),
      # downloaded and loaded with load-blob-crate, cargo out of reach
      - name: load a downloaded release asset with load-blob-crate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/blobs
          gh release download v0.7.0 --pattern 'libwordbag-linux-arm64.so' --dir /tmp/blobs
          env -i HOME="$HOME" PATH=/bin /usr/bin/sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval '(load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))' \
            --eval '(push (merge-pathnames "lisp/" (uiop:getcwd)) asdf:*central-registry*)' \
            --eval '(ql:quickload :rulisp :silent t)' \
            --eval '(rulisp:load-blob-crate #p"/tmp/blobs/" "wordbag")' \
            --eval '(format t "BLOB-ASSET-OK ~A~%" (uiop:symbol-call :wordbag :greet "release"))' | tee blob.log
          grep -q "BLOB-ASSET-OK Hello, release!" blob.log
