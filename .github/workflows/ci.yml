name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: cargo tests (golden manifest + trybuild)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - name: build the ABI oracle (standalone crate)
        run: cargo build --manifest-path tests/m1-handwritten/Cargo.toml
      - name: BOUNDARY §7 signal audit over every example (with self-test)
        run: make audit

  sbcl-linux:
    name: SBCL / Linux x86-64 (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: install quicklisp
        run: |
          curl -sO https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'
      - name: oracle gate (hand-written shims)
        run: make test-m2
      - name: full gate (macro pipeline + hardening)
        run: make test-m4

  ccl-linux:
    name: CCL / Linux x86-64 (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install ccl
        run: |
          curl -sL -o ccl.tar.gz https://github.com/Clozure/ccl/releases/download/v1.13/ccl-1.13-linuxx86.tar.gz
          tar xzf ccl.tar.gz -C "$HOME"
      - run: sudo apt-get update && sudo apt-get install -y sbcl # quicklisp installer convenience
      - name: install quicklisp
        run: |
          curl -sO https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'
      - run: make test-ccl CCL="$HOME/ccl/lx86cl64"

  sbcl-macos:
    name: SBCL / macOS arm64 (required)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install sbcl
      - name: install quicklisp
        run: |
          curl -sO https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'
      - run: make test-m4

  sbcl-windows:
    name: SBCL / Windows x86-64 (required)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo tests (platform-independent)
        run: cargo test --workspace
      # the community feed 503s occasionally; a required job must not
      # flake on a package-feed hiccup
      - name: install sbcl (with retry)
        run: |
          for i in 1 2 3 4 5; do
            choco install sbcl --no-progress -y && exit 0
            echo "choco attempt $i failed; retrying in $((i*30))s"
            sleep $((i*30))
          done
          exit 1
      - name: install quicklisp
        run: |
          curl -sO https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'
      - name: full gate
        run: make test-m4

  ecl-linux:
    # Promoted to required 2026-09-02 after 24 consecutive green runs since
    # 2026-07-29 (the ECL trampoline fix), with the program-op deployment
    # smoke added in v0.4. "Fully supported" and "may fail" cannot both be
    # true. DEMOTION PROCEDURE, should ECL flake: restore
    # `continue-on-error: true` and the "(best-effort, may fail)" name in
    # ONE commit that also (a) links the failing run, (b) notes the cause
    # in ROADMAP.md item 8, and (c) downgrades CHANGELOG/README wording
    # from "supported" to "best-effort" — never silently.
    name: ECL / Linux (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ecl sbcl
      - name: install quicklisp
        run: |
          curl -sO https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'
      # ecl exits 0 even after landing in the debugger on EOF — require the
      # suite's own summary line so a crashed run cannot show green
      - run: |
          ecl --norc --load tests/run-m4.lisp 2>&1 | tee ecl.log
          grep -q "Pass: " ecl.log && ! grep -qE "Fail: *[1-9]" ecl.log
      - name: program-op executable (the ECL deployment story)
        run: make test-ecl-program
