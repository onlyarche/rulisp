[package]
name = "rulisp-macros"
version = "0.4.0"
edition = "2021"
description = "Proc-macros for rulisp glue crates: #[rulisp::handle], #[rulisp::export], rulisp::module!"
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/onlyarche/rulisp"
keywords = ["lisp", "common-lisp", "ffi", "proc-macro"]
categories = ["development-tools::ffi"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
