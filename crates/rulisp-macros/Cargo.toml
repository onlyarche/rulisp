[package]
name = "rulisp-macros"
version = "0.1.0"
edition = "2021"
description = "Proc-macros for rulisp glue crates: #[rulisp::handle], #[rulisp::export], rulisp::module!"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
